---
timezone: "Europe/Paris"

base_packages:
  - qemu-guest-agent
  - curl
  - vim
  - htop
  - git
  - unzip
  - ca-certificates
  - gnupg

# Ports opened by UFW on every host (SSH is always allowed)
ufw_common_ports:
  - "9100" # node_exporter, scraped by Prometheus

# Extra ports per group (referenced in the hardening role)
ufw_group_ports:
  proxy:
    - "80"
    - "443"
    - "8080" # Traefik dashboard (lab only)
  monitoring:
    - "9090" # Prometheus
    - "3000" # Grafana
  apps: []
  web:
    - "80"
  drive:
    - "80"
    - "443"

# Shared drive (Nextcloud) — CHANGE these before deploying for real,
# or better: move them to an Ansible Vault.
drive_db_password: "changeme-drive-db"
drive_db_root_password: "changeme-drive-root"

# Public exposure of the drive (free): DuckDNS subdomain + Let's Encrypt via
# Caddy. Create the subdomain and get the token on https://www.duckdns.org,
# then fill these in (move the token to Ansible Vault when possible).
drive_duckdns_subdomain: "CHANGEME" # -> CHANGEME.duckdns.org
drive_duckdns_token: "CHANGEME"
drive_domain: "{{ drive_duckdns_subdomain }}.duckdns.org"
# External HTTPS port forwarded by the router (443 was taken by the
# AnyConnect VPN server). Users reach https://<domain>:<this port>.
drive_public_port: "8443"
