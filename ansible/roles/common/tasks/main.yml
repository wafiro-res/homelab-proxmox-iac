---
# Native apt lock waiting: any apt-get invocation (ours or a role's) blocks
# up to 10 min for the dpkg lock instead of failing when unattended-upgrades
# or a first-boot task holds it.
- name: Make apt wait for the dpkg lock instead of failing
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/90lock-timeout
    mode: "0644"
    content: |
      DPkg::Lock::Timeout "600";

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    lock_timeout: 600
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    lock_timeout: 600
    name: "{{ base_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

# The agent needs a virtio device that Proxmox only attaches when the VM's
# "agent" option is on. Terraform keeps it off (see main.tf), so the service
# is started only when the device is actually present.
- name: Check for the QEMU guest agent virtio device
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: common_qga_device

- name: Enable and start qemu-guest-agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: common_qga_device.stat.exists
