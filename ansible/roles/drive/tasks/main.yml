---
- name: Check if secondary data disk /dev/sdb exists
  ansible.builtin.stat:
    path: /dev/sdb
  register: drive_data_disk

- name: Install partitioning tools
  ansible.builtin.apt:
    lock_timeout: 600
    name: parted
    state: present
  when: drive_data_disk.stat.exists

- name: Partition the data disk (scsi1 = /dev/sdb)
  community.general.parted:
    device: /dev/sdb
    number: 1
    state: present
    fs_type: ext4
  when: drive_data_disk.stat.exists

- name: Create the filesystem on the data disk
  community.general.filesystem:
    fstype: ext4
    dev: /dev/sdb1
  when: drive_data_disk.stat.exists

- name: Mount the data disk on /srv/drive (persistent via fstab)
  ansible.posix.mount:
    path: /srv/drive
    src: /dev/sdb1
    fstype: ext4
    opts: defaults,noatime
    state: mounted
  when: drive_data_disk.stat.exists

- name: Create Nextcloud directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/drive
    - /srv/drive/nextcloud
    - /srv/drive/db

- name: Deploy docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/drive/docker-compose.yml
    mode: "0600"

- name: Start the drive stack
  community.docker.docker_compose_v2:
    project_src: /opt/drive
    state: present
    remove_orphans: true

# trusted_domains / overwrite settings are written into config.php at first
# init only, so container env vars do not re-apply later. Set them idempotently
# with occ so the public domain is always accepted (Cloudflare terminates TLS,
# so no port in the URL).
- name: Wait for the Nextcloud container to be ready
  ansible.builtin.command: docker exec -u www-data drive-nextcloud php occ status
  register: drive_nc_status
  until: drive_nc_status.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Configure trusted domains, proxies, default app and public URL (occ)
  ansible.builtin.command: "docker exec -u www-data drive-nextcloud php occ config:system:set {{ item }}"
  loop:
    - "trusted_domains 0 --value={{ ansible_host }}"
    - "trusted_domains 1 --value=drive.lab.local"
    - "trusted_domains 2 --value={{ drive_domain }}"
    - "overwritehost --value={{ drive_domain }}"
    - "overwriteprotocol --value=https"
    - "overwrite.cli.url --value=https://{{ drive_domain }}"
    - "trusted_proxies 0 --value=127.0.0.1"
    - "trusted_proxies 1 --value=172.16.0.0/12"
    - "trusted_proxies 2 --value=::1"
    - "defaultapp --value=files"
    - "skeletondirectory --value="
  changed_when: false

- name: Disable clutter apps for a clean Drive and Photos experience
  ansible.builtin.command: "docker exec -u www-data drive-nextcloud php occ app:disable {{ item }}"
  loop:
    - dashboard
    - weather_status
    - user_status
    - survey_client
    - recommendations
    - firstrunwizard
    - nextcloud_announcements
    - whats_new
  failed_when: false
  changed_when: false
