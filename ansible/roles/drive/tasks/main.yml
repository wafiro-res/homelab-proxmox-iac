---
- name: Install partitioning tools
  ansible.builtin.apt:
    lock_timeout: 600
    name: parted
    state: present

- name: Partition the data disk (scsi1 = /dev/sdb)
  community.general.parted:
    device: /dev/sdb
    number: 1
    state: present
    fs_type: ext4

- name: Create the filesystem on the data disk
  community.general.filesystem:
    fstype: ext4
    dev: /dev/sdb1

- name: Mount the data disk on /srv/drive (persistent via fstab)
  ansible.posix.mount:
    path: /srv/drive
    src: /dev/sdb1
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Create Nextcloud directories on the data disk
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/drive
    - /srv/drive/nextcloud
    - /srv/drive/db
    - /srv/drive/caddy-data
    - /srv/drive/caddy-config

- name: Create the Caddy image build directory
  ansible.builtin.file:
    path: /opt/drive/caddy
    state: directory
    mode: "0755"

- name: Deploy the Caddy Dockerfile (DuckDNS DNS module)
  ansible.builtin.copy:
    src: Dockerfile.caddy
    dest: /opt/drive/caddy/Dockerfile
    mode: "0644"
  notify: Restart drive stack

- name: Deploy Caddyfile (TLS reverse proxy)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/drive/Caddyfile
    mode: "0644"
  notify: Restart drive stack

- name: Deploy docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/drive/docker-compose.yml
    mode: "0600"

- name: Start Nextcloud
  community.docker.docker_compose_v2:
    project_src: /opt/drive
    state: present
    build: policy
    remove_orphans: true

# trusted_domains / overwrite settings are written into config.php at first
# init only, so the container env vars do not re-apply on later runs. Set them
# idempotently with occ so the public domain + port are always accepted.
- name: Wait for the Nextcloud container to be ready
  ansible.builtin.command: docker exec -u www-data drive-nextcloud php occ status
  register: drive_nc_status
  until: drive_nc_status.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Configure trusted domains and public URL (occ)
  ansible.builtin.command: "docker exec -u www-data drive-nextcloud php occ config:system:set {{ item }}"
  loop:
    - "trusted_domains 0 --value={{ ansible_host }}"
    - "trusted_domains 1 --value=drive.lab.local"
    - "trusted_domains 2 --value={{ drive_domain }}:{{ drive_public_port }}"
    - "overwritehost --value={{ drive_domain }}:{{ drive_public_port }}"
    - "overwriteprotocol --value=https"
    - "overwrite.cli.url --value=https://{{ drive_domain }}:{{ drive_public_port }}"
  changed_when: false
