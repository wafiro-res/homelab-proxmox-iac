---
- name: Base configuration, hardening and node_exporter (all hosts)
  hosts: all
  become: true
  pre_tasks:
    # Fresh VMs run a full package upgrade on first boot (cloud-init):
    # wait for it to finish instead of fighting over the dpkg lock.
    - name: Wait for cloud-init to finish the first boot
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  roles:
    - common
    - hardening
    - node_exporter

- name: Install Docker on service hosts
  hosts: proxy:apps:monitoring:web
  become: true
  roles:
    - docker

- name: Deploy the Traefik reverse proxy
  hosts: proxy
  become: true
  roles:
    - traefik

- name: Deploy the monitoring stack (Prometheus + Grafana)
  hosts: monitoring
  become: true
  roles:
    - monitoring

- name: Deploy the CV website
  hosts: web
  become: true
  roles:
    - cv_site
